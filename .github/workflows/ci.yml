name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift --version
      # Remote rows' tests and e2e play a host on this Mac, with Homebrew's tmux.
      - run: brew install tmux
      - run: make lint
      - run: make build
      - run: make ios
      - run: scripts/ci-test.sh

  # What canopy-box shares with the Mac, built and tested on Linux, where Package.swift declares only those modules.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      # canopy-box's tests drive real tmux and git.
      - run: apt-get update -q && apt-get install -qy --no-install-recommends tmux git
      - run: swift build -Xswiftc -warnings-as-errors
      # As make test runs it: one task that blocks a pool thread starves the rest.
      - run: LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test
